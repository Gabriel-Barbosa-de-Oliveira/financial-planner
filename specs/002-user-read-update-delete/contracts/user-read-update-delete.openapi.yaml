openapi: 3.0.3
info:
  title: Financial Control - Consulta, Alteração e Desativação de Usuário
  version: 0.2.0
  description: Complementa create-user.openapi.yaml (feature 001). Operações abertas no MVP, sem autenticação.
servers:
  - url: http://localhost:8080/financial-control
paths:
  /users:
    get:
      summary: Lista os usuários ativos
      operationId: listUsers
      responses:
        '200':
          description: Usuários ativos por ordem de criação (lista vazia quando não há nenhum)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Consulta um usuário ativo pelo identificador
      operationId: getUserById
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Altera e-mail e/ou senha de um usuário ativo
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              email:
                value:
                  email: novo@exemplo.com
              password:
                value:
                  password: nova-senha-123
      responses:
        '200':
          description: Usuário alterado; updatedAt renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: E-mail já está em uso por outro usuário ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: USED_EMAIL
                message: E-mail já está em uso
                statusCode: 409
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Desativa o usuário (exclusão lógica; nada é apagado fisicamente)
      operationId: deactivateUser
      responses:
        '204':
          description: Usuário desativado; passa a ser tratado como inexistente
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    ValidationError:
      description: Identificador, corpo ou campo inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            invalidId:
              value:
                error: Validation Error
                message: Dados enviados não passaram na validação
                statusCode: 400
                issues:
                  - field: id
                    message: Identificador inválido
            emptyBody:
              value:
                error: Validation Error
                message: Dados enviados não passaram na validação
                statusCode: 400
                issues:
                  - field: body
                    message: Informe ao menos um campo para alterar (email ou password)
    NotFound:
      description: Usuário inexistente ou desativado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: USER_NOT_FOUND
            message: Usuário não encontrado
            statusCode: 404
    InternalError:
      description: Erro inesperado, sem detalhes internos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalizado (sem espaços nas pontas, minúsculas) antes de validar e gravar
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
    User:
      type: object
      required: [id, email, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Nunca contém senha nem hash
    Error:
      type: object
      required: [error, message, statusCode]
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [issues]
          properties:
            issues:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
