openapi: 3.0.3
info:
  title: Financial Control - Cadastro de Usuário
  version: 0.1.0
servers:
  - url: http://localhost:8080/financial-control
paths:
  /users:
    post:
      summary: Cadastra um usuário
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: ana@exemplo.com
              password: senha-segura-123
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dados inválidos (campo ausente, formato, tamanho ou campo não permitido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: E-mail já está em uso por um usuário ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: USED_EMAIL
                message: E-mail já está em uso
                statusCode: 409
        '500':
          description: Erro inesperado, sem detalhes internos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Normalizado (sem espaços nas pontas, minúsculas) antes de validar e gravar
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
    User:
      type: object
      required: [id, email, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Nunca contém senha nem hash
    Error:
      type: object
      required: [error, message, statusCode]
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [issues]
          properties:
            issues:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
