$kind: http-request
description: 'Cadastra uma segunda classificação. Define `secondClassificationId` e `secondClassificationName`.'
url: '{{BASE_URL}}/financial-control/classifications'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{secondClassificationName}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('secondClassificationName', `Comidas ${pm.collectionVariables.get('classificationRunId')}`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('secondClassificationId', pm.response.json().id);
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 1100
