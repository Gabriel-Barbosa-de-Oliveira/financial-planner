$kind: http-request
description: 'O nome da classificação desativada pode ser reutilizado: 201 com outro id. Define `recreatedClassificationId`.'
url: '{{BASE_URL}}/financial-control/classifications'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{createdClassificationName}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201 com outro id', () => {
        pm.response.to.have.status(201);
        const item = pm.response.json();
        pm.expect(item.id).to.not.eql(pm.collectionVariables.get('createdClassificationId'));
        pm.collectionVariables.set('recreatedClassificationId', item.id);
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 8500
