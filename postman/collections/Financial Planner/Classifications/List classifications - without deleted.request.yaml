$kind: http-request
description: 'A lista não contém a classificação desativada, mas contém a segunda.'
url: '{{BASE_URL}}/financial-control/classifications'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200 sem a desativada e com a segunda', () => {
        pm.response.to.have.status(200);
        const ids = pm.response.json().map((i) => i.id);
        pm.expect(ids).to.not.include(pm.collectionVariables.get('createdClassificationId'));
        pm.expect(ids).to.include(pm.collectionVariables.get('secondClassificationId'));
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 8400
