$kind: http-request
description: 'UUID inexistente: 404.'
url: '{{BASE_URL}}/financial-control/classifications/00000000-0000-4000-8000-000000000000/reactivate'
method: POST
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 404 Classificação não encontrada', () => {
        pm.response.to.have.status(404);
        const body = pm.response.json();
        pm.expect(body.error).to.eql('CLASSIFICATION_NOT_FOUND');
        pm.expect(body.message).to.eql('Classificação não encontrada');
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 8900
