$kind: http-example
description: 'Get user - not found - 404'
request:
  url: '{{BASE_URL}}/financial-control/users/00000000-0000-4000-8000-000000000000'
  method: GET
response:
  statusCode: 404
  statusText: 'Not Found'
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "error": "USER_NOT_FOUND",
        "message": "Usuário não encontrado",
        "statusCode": 404
      }
order: 1000
