$kind: http-request
description: 'Senha com exatamente 8 caracteres (limite inferior): deve ser aceita, 201.'
url: '{{BASE_URL}}/financial-control/users'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{rawEmail}}",
      "password": "12345678"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // E-mail único por execução, com caixa mista e espaços, para exercitar a normalização
      const raw = `  Ana.${Date.now()}@Exemplo.com `;
      pm.collectionVariables.set('rawEmail', raw);
      pm.collectionVariables.set('createdUserEmail', raw.trim().toLowerCase());
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 201) {
        const second = pm.response.json();
        pm.collectionVariables.set('secondUserId', second.id);
        pm.collectionVariables.set('secondUserEmail', second.email);
      }
      pm.test('responde 201 com senha de 8 caracteres', () => pm.response.to.have.status(201));
      pm.test('e-mail normalizado e usuário ativo', () => {
        const user = pm.response.json();
        pm.expect(user.email).to.eql(pm.collectionVariables.get('createdUserEmail'));
        pm.expect(user.isActive).to.eql(true);
      });
      pm.test('nunca expõe o valor da senha nem o hash', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('12345678');
        pm.expect(text).to.not.include('scrypt');
        pm.expect(text).to.not.include('password_hash');
        pm.expect(text).to.not.include('passwordhash');
      });
order: 8000
