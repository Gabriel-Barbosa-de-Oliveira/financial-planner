$kind: http-request
description: 'Tenta definir `id` e `isActive` no cadastro: 400, o cliente não controla esses campos.'
url: '{{BASE_URL}}/financial-control/users'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "proibido@exemplo.com",
      "password": "senha-segura-123",
      "id": "00000000-0000-0000-0000-000000000000",
      "isActive": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400 de validação', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('Validation Error');
      });
      pm.test('recusa os campos não permitidos', () => {
        const texts = (pm.response.json().issues || []).map((i) => i.message);
        pm.expect(texts).to.include('Campo não permitido no cadastro de usuário');
      });

      pm.test('nunca expõe o valor da senha nem o hash', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('senha-segura-123');
        pm.expect(text).to.not.include('scrypt');
        pm.expect(text).to.not.include('password_hash');
        pm.expect(text).to.not.include('passwordhash');
      });
order: 7000
