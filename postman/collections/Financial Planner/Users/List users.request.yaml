$kind: http-request
description: 'Lista os usuários ativos por ordem de criação. Deve conter o usuário criado em `Create user`.'
url: '{{BASE_URL}}/financial-control/users'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200 com um array', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.be.an('array');
      });
      const users = pm.response.json();
      pm.test('contém o usuário criado e cada item tem só os campos públicos', () => {
        pm.expect(users.map((u) => u.id)).to.include(pm.collectionVariables.get('createdUserId'));
        users.forEach((u) => pm.expect(Object.keys(u).sort()).to.eql(['createdAt', 'email', 'id', 'isActive', 'updatedAt']));
        users.forEach((u) => pm.expect(u.isActive).to.eql(true));
      });
      pm.test('ordenado por data de criação', () => {
        const times = users.map((u) => new Date(u.createdAt).getTime());
        pm.expect(times).to.eql([...times].sort((a, b) => a - b));
      });
      pm.test('nunca expõe o valor da senha nem o hash', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('senha-segura-123');
        pm.expect(text).to.not.include('nova-senha-123');
        pm.expect(text).to.not.include('scrypt');
        pm.expect(text).to.not.include('password_hash');
        pm.expect(text).to.not.include('passwordhash');
      });
examples: './.resources/List users.resources/examples'
order: 9000
