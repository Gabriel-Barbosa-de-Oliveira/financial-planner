$kind: http-request
description: 'Senha com 73 caracteres (máximo 72): 400 apontando `password`.'
url: '{{BASE_URL}}/financial-control/users'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "longa@exemplo.com",
      "password": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400 de validação', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('Validation Error');
      });
      const issues = pm.response.json().issues || [];
      pm.test('aponta os campos inválidos: password', () => {
        pm.expect(issues.map((i) => i.field).sort()).to.eql(["password"]);
      });
      pm.test('mensagens de validação em português', () => {
        const texts = issues.map((i) => i.message);
        pm.expect(texts).to.include("Senha deve ter no máximo 72 caracteres");
      });
      pm.test('nunca expõe o valor da senha nem o hash', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('senha-segura-123');
        pm.expect(text).to.not.include('scrypt');
        pm.expect(text).to.not.include('password_hash');
        pm.expect(text).to.not.include('passwordhash');
      });
order: 5000
