$kind: http-request
description: 'O e-mail do usuário desativado pode ser cadastrado de novo, com outro `id`.'
url: '{{BASE_URL}}/financial-control/users'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{createdUserEmail}}",
      "password": "senha-segura-123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201 com outro id', () => {
        pm.response.to.have.status(201);
        const user = pm.response.json();
        pm.expect(user.email).to.eql(pm.collectionVariables.get('createdUserEmail'));
        pm.expect(user.id).to.not.eql(pm.collectionVariables.get('createdUserId'));
      });
      pm.test('nunca expõe o valor da senha nem o hash', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('senha-segura-123');
        pm.expect(text).to.not.include('nova-senha-123');
        pm.expect(text).to.not.include('scrypt');
        pm.expect(text).to.not.include('password_hash');
        pm.expect(text).to.not.include('passwordhash');
      });
order: 11500
