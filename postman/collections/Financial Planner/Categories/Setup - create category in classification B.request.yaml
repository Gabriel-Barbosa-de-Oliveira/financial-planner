$kind: http-request
description: 'Cria uma categoria na classificação B para o teste de reativação com classificação inativa. Define `fifthCategoryId`.'
url: '{{BASE_URL}}/financial-control/categories'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{fifthCategoryName}}",
      "type": "SAIDA",
      "classificationId": "{{catClassBId}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('fifthCategoryName', `Academia ${pm.collectionVariables.get('categoryRunId')}`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201', () => {
        pm.response.to.have.status(201);
        pm.collectionVariables.set('fifthCategoryId', pm.response.json().id);
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 8800
