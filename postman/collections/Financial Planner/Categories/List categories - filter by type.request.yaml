$kind: http-request
description: 'Filtra por tipo ENTRADA.'
url: '{{BASE_URL}}/financial-control/categories?type=ENTRADA'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200 só com entradas', () => {
        pm.response.to.have.status(200);
        const items = pm.response.json();
        pm.expect(items.map((i) => i.id)).to.include.members([pm.collectionVariables.get('secondCategoryId'), pm.collectionVariables.get('thirdCategoryId')]);
        items.forEach((i) => pm.expect(i.type).to.eql('ENTRADA'));
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 4200
