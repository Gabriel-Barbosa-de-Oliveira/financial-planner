$kind: http-request
description: 'Reativar a classificação não religa a categoria.'
url: '{{BASE_URL}}/financial-control/categories/{{createdCategoryId}}'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200 e continua sem classificação', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().classification).to.eql(null);
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 7500
