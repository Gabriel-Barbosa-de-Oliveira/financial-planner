$kind: http-request
description: 'Cria a classificação A (Automóvel) usada nesta pasta. Define `catClassAId` e `catClassAName`.'
url: '{{BASE_URL}}/financial-control/classifications'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{catClassAName}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const run = Date.now();
      pm.collectionVariables.set('categoryRunId', String(run));
      pm.collectionVariables.set('catClassAName', `Automóvel ${run}`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('catClassAId', pm.response.json().id);
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 1000
