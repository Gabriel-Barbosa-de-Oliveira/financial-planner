$kind: http-request
description: 'Desativa a classificação B (a categoria já está inativa e não é tocada).'
url: '{{BASE_URL}}/financial-control/classifications/{{catClassBId}}'
method: DELETE
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 204', () => pm.response.to.have.status(204));
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 8820
