$kind: http-request
description: 'Nome vazio, tipo fora da lista e classificação malformada: 400 com `issues` por campo.'
url: '{{BASE_URL}}/financial-control/categories'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "",
      "type": "SAÍDA",
      "classificationId": "abc"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400 com issues por campo', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().issues.map((i) => i.field).sort()).to.eql(['classificationId', 'name', 'type']);
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 3200
