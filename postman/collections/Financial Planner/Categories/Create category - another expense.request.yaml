$kind: http-request
description: 'Segunda categoria de saída, usada nos testes de nome em uso. Define `fourthCategoryName`.'
url: '{{BASE_URL}}/financial-control/categories'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{fourthCategoryName}}",
      "type": "SAIDA",
      "classificationId": "{{catClassAId}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('fourthCategoryName', `Pedágio ${pm.collectionVariables.get('categoryRunId')}`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201', () => pm.response.to.have.status(201));
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 2300
