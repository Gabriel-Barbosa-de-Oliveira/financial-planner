$kind: http-request
description: 'Remove a classificação com `null`.'
url: '{{BASE_URL}}/financial-control/categories/{{createdCategoryId}}'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "classificationId": null
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200 sem classificação', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().classification).to.eql(null);
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 6200
