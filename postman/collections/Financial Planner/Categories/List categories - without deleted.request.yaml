$kind: http-request
description: 'A lista não contém a categoria desativada.'
url: '{{BASE_URL}}/financial-control/categories'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 200 sem a desativada', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().map((i) => i.id)).to.not.include(pm.collectionVariables.get('createdCategoryId'));
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 8300
