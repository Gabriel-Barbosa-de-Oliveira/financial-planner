$kind: http-request
description: 'Tenta usar o nome de outra categoria de saída: 409.'
url: '{{BASE_URL}}/financial-control/categories/{{createdCategoryId}}'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{fourthCategoryName}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 409 Já existe uma categoria com este nome para este tipo', () => {
        pm.response.to.have.status(409);
        const body = pm.response.json();
        pm.expect(body.error).to.eql('USED_CATEGORY_NAME');
        pm.expect(body.message).to.eql('Já existe uma categoria com este nome para este tipo');
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 6300
