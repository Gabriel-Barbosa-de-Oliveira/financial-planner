$kind: http-request
description: 'Conta inexistente: 404.'
url: '{{BASE_URL}}/financial-control/accounts/00000000-0000-4000-8000-000000000000'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "X"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 404 Conta não encontrada', () => {
        pm.response.to.have.status(404);
        const body = pm.response.json();
        pm.expect(body.error).to.eql('ACCOUNT_NOT_FOUND');
        pm.expect(body.message).to.eql('Conta não encontrada');
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 10600
