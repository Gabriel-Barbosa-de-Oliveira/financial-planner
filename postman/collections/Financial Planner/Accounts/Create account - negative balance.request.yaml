$kind: http-request
description: 'Saldo inicial negativo é aceito (cheque especial / cartão) e preservado como texto exato.'
url: '{{BASE_URL}}/financial-control/accounts'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Cartão {{accountRunId}}",
      "type": "SAVINGS",
      "balance": "-250.50"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201 com o saldo negativo exato', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().balance).to.eql('-250.50');
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 3000
