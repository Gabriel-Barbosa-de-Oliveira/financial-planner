$kind: http-request
description: 'Desativa a conta criada (exclusão lógica): 204 sem corpo.'
url: '{{BASE_URL}}/financial-control/accounts/{{createdAccountId}}'
method: DELETE
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 204 sem corpo', () => {
        pm.response.to.have.status(204);
        pm.expect(pm.response.text()).to.eql('');
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 11000
