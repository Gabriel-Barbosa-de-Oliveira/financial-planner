$kind: http-request
description: 'A conta desativada não aparece na lista; a segunda conta continua.'
url: '{{BASE_URL}}/financial-control/accounts'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('lista sem a conta desativada e com a segunda conta', () => {
        pm.response.to.have.status(200);
        const ids = pm.response.json().map((a) => a.id);
        pm.expect(ids).to.not.include(pm.collectionVariables.get('createdAccountId'));
        pm.expect(ids).to.include(pm.collectionVariables.get('secondAccountId'));
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 11400
