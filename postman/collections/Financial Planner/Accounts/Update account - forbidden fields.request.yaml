$kind: http-request
description: 'O saldo não muda por alteração de cadastro; `balance` e `isActive` são recusados: 400.'
url: '{{BASE_URL}}/financial-control/accounts/{{createdAccountId}}'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Qualquer",
      "balance": "10.00",
      "isActive": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400 com campo não permitido', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().issues.map((i) => i.message)).to.include('Campo não permitido na alteração de conta');
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 10500
