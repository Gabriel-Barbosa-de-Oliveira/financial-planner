$kind: http-request
description: 'O nome de uma conta desativada pode ser reutilizado: 201 com outro id.'
url: '{{BASE_URL}}/financial-control/accounts'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{updatedAccountName}}",
      "type": "BANK"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 201 com outro id', () => {
        pm.response.to.have.status(201);
        pm.expect(pm.response.json().id).to.not.eql(pm.collectionVariables.get('createdAccountId'));
        pm.expect(pm.response.json().name).to.eql(pm.collectionVariables.get('updatedAccountName'));
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 11500
