$kind: http-request
description: 'Campos que o cliente não pode definir (`isActive`, `workspaceId`): 400.'
url: '{{BASE_URL}}/financial-control/accounts'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Proibida {{accountRunId}}",
      "type": "CASH",
      "isActive": false,
      "workspaceId": "00000000-0000-4000-8000-000000000000"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde 400 de validação', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.eql('Validation Error');
        pm.expect(pm.response.json().issues.map((i) => i.message)).to.include('Campo não permitido no cadastro de conta');
      });
      pm.test('não expõe o workspace nem detalhes internos', () => {
        const text = pm.response.text().toLowerCase();
        pm.expect(text).to.not.include('workspace');
        pm.expect(text).to.not.include('stack');
      });
order: 7000
