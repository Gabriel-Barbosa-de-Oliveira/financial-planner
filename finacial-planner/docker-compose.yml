  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - financial-network
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules

  # ============================================
  # CLOUDBEAVER COMMUNITY (Interface moderna)
  # ============================================
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: financial-control-cloudbeaver
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    environment:
      CB_ENABLE_PRODUCT_UPDATES: "false"
      CB_ANONYMIZE_STATISTICS: "true"
    networks:
      - financial-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  cloudbeaver_data:

networks:
  financial-network:
    driver: bridge
