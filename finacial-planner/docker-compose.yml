# docker-compose.yml
version: "3.8"

services:
  postgres:
    build:
      context: .
      dockerfile: ./database/Dockerfile
    container_name: financial-control-db
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: financial_control_db
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U financial_user -d financial_control_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial-network

  # Backend (Node.js) - Para depois
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: financial-control-api
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USER: financial_user
  #     DB_PASSWORD: secure_password_123
  #     DB_NAME: financial_control_db
  #     NODE_ENV: development
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - financial-network
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules

  # ============================================
  # PGADMIN4 (Interface gráfica para o banco)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financial-control-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@financial.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password_123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - financial-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  financial-network:
    driver: bridge
