# docker-compose.yml
services:
  postgres:
    build:
      context: .
      dockerfile: ./database/Dockerfile
    container_name: financial-control-db
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: financial_control_db
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U financial_user -d financial_control_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial-network

  # Backend (Node.js) - Para depois
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: financial-control-api
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USER: financial_user
  #     DB_PASSWORD: secure_password_123
  #     DB_NAME: financial_control_db
  #     NODE_ENV: development
  #   ports:
  #     - "3000:3000"
